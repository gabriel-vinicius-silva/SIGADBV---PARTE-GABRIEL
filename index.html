<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Unidade | SIGADBV</title>

    <link rel="stylesheet" href="cadastro-unidade.css">
</head>

<body>

    <main class="page-container">

        <section class="register-card">

            <!-- =========================================
                 LOGO
            ========================================== -->

            <div class="logo-area">

                <img
                    src="img/logodbv.png"
                    alt="Logo do clube"
                    class="club-logo"
                >

            </div>


            <!-- =========================================
                 CABEÇALHO
            ========================================== -->

            <div class="header-area">

                <h1>SIGADBV</h1>

                <p>
                    Cadastre uma nova unidade do clube
                </p>

            </div>


            <!-- =========================================
                 FORMULÁRIO
            ========================================== -->

            <form
                class="register-form"
                id="unitRegisterForm"
            >

                <!-- =====================================
                     NOME DA UNIDADE
                ====================================== -->

                <div class="input-group">

                    <label for="unitName">
                        Nome da Unidade
                    </label>

                    <input
                        type="text"
                        id="unitName"
                        name="unitName"
                        placeholder="Digite o nome da unidade"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- =====================================
                     INTEGRANTES
                ====================================== -->

                <div class="members-section">

                    <label for="memberName">
                        Integrantes
                    </label>


                    <div class="member-input-area">

                        <input
                            type="text"
                            id="memberName"
                            placeholder="Nome do integrante"
                            autocomplete="off"
                        >

                        <button
                            type="button"
                            class="add-member-button"
                            id="addMemberButton"
                        >
                            +
                        </button>

                    </div>


                    <!-- =================================
                         LISTA DE INTEGRANTES
                    ================================== -->

                    <div
                        class="members-list"
                        id="membersList"
                    >

                        <!-- Os integrantes serão adicionados aqui -->

                    </div>

                </div>


                <!-- =====================================
                     BOTÃO DE CADASTRO
                ====================================== -->

                <button
                    type="submit"
                    class="register-button"
                >
                    Cadastrar Unidade
                </button>


                <!-- =====================================
                     VOLTAR
                ====================================== -->

                <a
                    href="index.html"
                    class="back-link"
                >
                    Voltar para o acesso
                </a>

            </form>

        </section>

    </main>


    <!-- =============================================
         JAVASCRIPT
    ============================================== -->

    <script>

        const form = document.getElementById("unitRegisterForm");

        const memberInput = document.getElementById("memberName");

        const addMemberButton =
            document.getElementById("addMemberButton");

        const membersList =
            document.getElementById("membersList");


        let members = [];


        /* =========================================
           ADICIONAR INTEGRANTE
        ========================================== */

        function addMember() {

            const name = memberInput.value.trim();


            if (name === "") {
                return;
            }


            members.push(name);


            memberInput.value = "";

            memberInput.focus();


            renderMembers();

        }


        /* =========================================
           REMOVER INTEGRANTE
        ========================================== */

        function removeMember(index) {

            members.splice(index, 1);

            renderMembers();

        }


        /* =========================================
           MOSTRAR INTEGRANTES
        ========================================== */

        function renderMembers() {

            membersList.innerHTML = "";


            members.forEach((member, index) => {

                const memberItem =
                    document.createElement("div");

                memberItem.className = "member-item";


                const memberName =
                    document.createElement("span");

                memberName.className = "member-name";

                memberName.textContent = member;


                const removeButton =
                    document.createElement("button");

                removeButton.type = "button";

                removeButton.className =
                    "remove-member-button";

                removeButton.textContent = "×";


                removeButton.addEventListener(
                    "click",
                    () => removeMember(index)
                );


                memberItem.appendChild(memberName);

                memberItem.appendChild(removeButton);

                membersList.appendChild(memberItem);

            });

        }


        /* =========================================
           BOTÃO ADICIONAR
        ========================================== */

        addMemberButton.addEventListener(
            "click",
            addMember
        );


        /* =========================================
           ENTER NO CAMPO DE INTEGRANTE
        ========================================== */

        memberInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    addMember();

                }

            }
        );


        /* =========================================
           ENVIO DO FORMULÁRIO
        ========================================== */

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const unitName =
                    document.getElementById("unitName")
                    .value
                    .trim();


                if (unitName === "") {

                    return;

                }


                const unitData = {

                    nome: unitName,

                    integrantes: members

                };


                console.log(
                    "Unidade cadastrada:",
                    unitData
                );


                alert(
                    "Unidade cadastrada com sucesso!"
                );


                /*
                    Aqui posteriormente podemos
                    enviar os dados para o banco
                    de dados / backend.
                */

            }
        );

    </script>

</body>

</html>
